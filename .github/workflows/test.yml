name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m cernio_fraud_lab.experiment --offline --seeds 7 --no-curve --output /tmp/cernio-fraud-lab
